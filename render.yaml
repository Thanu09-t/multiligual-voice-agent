services:
  - type: web
    name: nova-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./nova.db
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: STT_PROVIDER
        value: groq
      - key: TTS_PROVIDER
        value: mock
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
